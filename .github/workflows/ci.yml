# Contrôles à chaque envoi : tests du moteur, empreinte de jeu et image Docker
# du serveur, telle que le serveur de prod la construit.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  moteur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: cargo test --release --manifest-path bot/Cargo.toml
      - name: Empreinte
        run: |
          cargo build --release --manifest-path bot/Cargo.toml --bin play
          bot/tests/empreinte.sh bot/target/release/play
      - name: Banc
        run: cargo build --release --manifest-path bench/Cargo.toml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image du serveur
        run: docker build -t linkx:ci bot
      - name: Empreinte dans l'image
        run: |
          got=$(printf '60000\t4Tr24 3Ir15\n' | docker run --rm -i -e LINKX_NODES=300000 linkx:ci play)
          echo "$got"
          [ "$got" = "$(printf '3Ir14\tscore 3944 prof 9 296883 nœuds')" ]
