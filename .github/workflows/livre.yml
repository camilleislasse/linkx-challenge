# Livre profond : chaque position qui suit une ligne de jeu est cherchée
# longuement, sur des machines en parallèle. Sans ligne donnée, le lot est le
# prochain de bench/livre-plan.txt ; ses résultats s'enregistrent alors dans la
# branche livre-data (resultats/<lot>.tsv, et livre.tsv qui les fusionne).
# Toutes les 6 heures, le lot suivant part tout seul.
name: Livre

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      apres:
        description: "Ligne de départ, ou « plan » pour le prochain lot du plan (« - » : plateau vide)"
        default: plan
      machines:
        description: Machines en parallèle (20 au plus)
        default: "20"
      budget:
        description: Minutes de calcul par machine (moins de 6 h, compilation comprise)
        default: "320"

permissions:
  contents: write

concurrency:
  group: livre
  cancel-in-progress: false

env:
  MACHINES: ${{ inputs.machines || '20' }}
  BUDGET: ${{ inputs.budget || '320' }}
  APRES: ${{ inputs.apres || 'plan' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      ligne: ${{ steps.lot.outputs.ligne }}
      nom: ${{ steps.lot.outputs.nom }}
      enregistrer: ${{ steps.lot.outputs.enregistrer }}
      parts: ${{ steps.split.outputs.parts }}
    steps:
      - uses: actions/checkout@v4
      - name: Résultats déjà faits
        run: git clone --quiet --depth 1 --branch livre-data "https://github.com/${{ github.repository }}" donnees || mkdir -p donnees/resultats
      - id: lot
        run: |
          if [ "$APRES" = plan ]; then
            python3 bench/livre_suivant.py bench/livre-plan.txt donnees bot/data/book-live.tsv >> "$GITHUB_OUTPUT"
            echo "enregistrer=oui" >> "$GITHUB_OUTPUT"
          else
            ligne=$([ "$APRES" = "-" ] && echo "" || echo "$APRES")
            echo "ligne=$ligne" >> "$GITHUB_OUTPUT"
            echo "nom=manuel" >> "$GITHUB_OUTPUT"
            echo "enregistrer=non" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"
      - id: split
        if: steps.lot.outputs.nom != ''
        env:
          LIGNE: ${{ steps.lot.outputs.ligne }}
        run: |
          cargo build --release --manifest-path bench/Cargo.toml --bin deepbook
          bench/target/release/deepbook --list "$LIGNE" > positions.txt
          echo "« $LIGNE » : $(wc -l < positions.txt) positions"
          echo "parts=$(jq -cn --argjson n "$MACHINES" '[range($n)]')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.lot.outputs.nom != ''
        with:
          name: positions
          path: positions.txt

  calcul:
    needs: plan
    if: needs.plan.outputs.nom != ''
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJson(needs.plan.outputs.parts) }}
    name: machine ${{ matrix.part }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: positions
      - name: Compilation
        run: cargo build --release --manifest-path bench/Cargo.toml --bin deepbook
      - name: Recherche
        env:
          PART: ${{ matrix.part }}
          LINKX_SOLVER: "1"
          LINKX_TT_MB: "4096"
          LINKX_TT_AGING: "0"
          LINKX_SOFT_PCT: "100"
        run: |
          LINKX_SEARCH_THREADS=$(nproc) \
            bench/target/release/deepbook --positions positions.txt --part "$PART/$MACHINES" --budget "$BUDGET" \
            > livre-$PART.tsv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: livre-${{ matrix.part }}
          path: livre-${{ matrix.part }}.tsv

  livre:
    needs: [plan, calcul]
    if: always() && needs.plan.outputs.nom != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: livre-*
          merge-multiple: true
      - name: Rassemblement
        env:
          LIGNE: ${{ needs.plan.outputs.ligne }}
        run: |
          cp bench/livre_fusion.py /tmp/
          python3 /tmp/livre_fusion.py livre-*.tsv > lot.tsv
          {
            echo "### Lot « $LIGNE » : $(wc -l < lot.tsv) positions (sous-livre compris), $(grep -c exact lot.tsv || true) prouvées"
            echo '```'
            cat lot.tsv
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: lot
          path: lot.tsv
      - name: Enregistrement dans livre-data
        if: needs.plan.outputs.enregistrer == 'oui'
        env:
          NOM: ${{ needs.plan.outputs.nom }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" depot
          cd depot
          git checkout livre-data 2>/dev/null || git checkout --orphan livre-data
          git rm -rq --cached . 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name resultats -exec rm -rf {} +
          mkdir -p resultats
          cp ../lot.tsv "resultats/$NOM.tsv"
          python3 /tmp/livre_fusion.py resultats/*.tsv > livre.tsv
          git add resultats livre.tsv
          git -c user.name="livre" -c user.email="livre@users.noreply.github.com" commit -qm "Livre : lot $NOM"
          git push -q origin livre-data
