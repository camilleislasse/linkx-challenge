# Banc de duel : deux versions ou deux réglages du moteur de ../bot s'affrontent,
# jusqu'à ce que le test séquentiel tranche. Lancé en local ou par le workflow
# « Banc » de GitHub Actions.
[package]
name = "bench"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "arena"
path = "src/main.rs"

[dependencies]
engine = { path = "../bot" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
